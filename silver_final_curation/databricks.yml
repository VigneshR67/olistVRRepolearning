# This is a Databricks asset bundle definition for mytest.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: mytest
  uuid: 23990efd-54c2-4a68-a53a-4ab69bf7614c

include:
  - resources/*.yml
  - resources/*/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-3913526520783845.5.azuredatabricks.net
    variables:
      catalog: hive_metastore
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://adb-3913526520783845.5.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/vignesh.rajasekar67@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/vignesh.rajasekar67@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: hive_metastore
      schema: prod
    permissions:
      - user_name: vignesh.rajasekar67@gmail.com
        level: CAN_MANAGE
